<!DOCTYPE html>
<html>
<head>
<title>Example template for the Library API</title>
<meta charset="UTF-8">
<style>
:root
{
    color-scheme: light dark; /* Opt the entire page into the user's color scheme preferences */
}

html
{
    margin: 0;
    padding: 0;
}
body
{
    margin: 0.5em; 
    padding: 0;
    align-items: start;
    justify-content: left;
    height: 100vh;
    font: 10.5pt "Calibri Light", Sans-serif;
    line-height: 1.2;
    color: #555753;
}
div
{ 
    margin: 0; 
    padding: 0;
}
</style>
</head>
<body>
<p>
<button id="showLibraryPreferencesButton">Library preferences</button>
<button id="searchButton">Search</button>
<button id="executeButton">Execute</button>
</p>
<p>
isLibraryEnabled: <span id="isLibraryEnabledResult" style="font-weight: bold"></span><br/>
</p>
<div>
<p>
onLibraryItemsAdded: <span id="onLibraryItemsAddedResult"></span><br/>
onLibraryItemsModified: <span id="onLibraryItemsModifiedResult"></span><br/>
onLibraryItemsRemoved: <span id="onLibraryItemsRemovedResult"></span><br/>
<div id="Items"/>
</p>
</div>
<script src="foobar2000.js"></script>
<script>
document.getElementById("isLibraryEnabledResult").textContent = MediaLibrary.isEnabled();

document.getElementById("executeButton").disabled = !Foobar2000.canExecuteShellOperations();

document.getElementById("showLibraryPreferencesButton").addEventListener("click", async () =>
{
    MediaLibrary.showPreferences();
});

document.getElementById("searchButton").addEventListener("click", async () =>
{
    const Tracks = new MetaDBHandleList(await MediaLibrary.search(""));

    let Text = "";

    const Count = Tracks.count;

    for (let i = 0; i < Count; ++i)
    {
        const Track = new MetaDBHandle(Tracks[i]);

        Text += Track.path + "<br/>";
    }
/* Enumeration does not work yet.
    forEach (Tracks, Track =>
    {
        Text += Track.relativePath + "<br/>";
    });
*/
    document.getElementById("Items").innerHTML = Text;

    Tracks.release();
});

document.getElementById("executeButton").addEventListener("click", async () =>
{
//  await Foobar2000.execute("notepad.exe");
//  await Foobar2000.execute("notepad.exe", "%SystemRoot%\\win.ini");
//  await Foobar2000.execute("notepad.exe", "%SystemRoot%\\win.ini", "%ProgramFiles%");
//  await Foobar2000.execute("notepad.exe", "%SystemRoot%\\win.ini", "%ProgramFiles%", "runas"); // Run notepad with elevated integrity
    await Foobar2000.execute("notepad.exe", "%SystemRoot%\\win.ini", "%ProgramFiles%", "open", SW_SHOWNORMAL);
});

// Called when items have been added to the library.
function onLibraryItemsAdded(items)
{
    document.getElementById("onLibraryItemsAddedResult").textContent = "Items have been added to the library (" + Now() + ")";

    const Items = JSON.parse(items);

    document.getElementById("Items").innerHTML = ArrayToTable(Items);
}

// Called when library items have been modified.
function onLibraryItemsModified(items)
{
    document.getElementById("onLibraryItemsModifiedResult").textContent = "Library items have been modified (" + Now() + ")";

    const Items = JSON.parse(items);

    document.getElementById("Items").innerHTML = ArrayToTable(Items);
}

// Called when library items have been removed.
function onLibraryItemsRemoved(items)
{
    document.getElementById("onLibraryItemsRemovedResult").textContent = "Library items have been removed (" + Now() + ")";

    const Items = JSON.parse(items);

    document.getElementById("Items").innerHTML = ArrayToTable(Items);
}

function ArrayToTable(Items)
{
    const Headers = Object.keys(Items[0]);

    let Table = '<table><thead><tr>';
    Headers.forEach(Header => Table += `<th>${Header}</th>`);
    Table += '</tr></thead><tbody>';

    Items.forEach(Row =>
    {
        Table += '<tr>';
        Headers.forEach(Header => Table += `<td>${Row[Header]}</td>`);
        Table += '</tr>';
    });

    Table += '</tbody></table>';

    return Table;
}

function Now()
{
    return new Date().toISOString().slice(-24).replace(/\D/g,'').slice(0, 14);
}
</script>
</body>
</html>
